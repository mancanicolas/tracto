[package]
name = "tracto"
version = "0.1.2"
description = "Tracto: agenda y CRM de cobranzas"
edition = "2021"

[lib]
name = "tracto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde_json = "1"
